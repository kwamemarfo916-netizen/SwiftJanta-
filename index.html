<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — SwiftJanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
  :root{
    --black:#0B0B0F; --black-2:#17171D; --paper:#F5F6FA;
    --blue:#2F6FED; --blue-bright:#4F8AFF; --green:#22935F;
    --red:#D64545; --ink:#14141A; --mist:#8A90A3; --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:linear-gradient(180deg, var(--black) 0%, var(--black-2) 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:2.5rem 1.25rem;
  }
  .auth-wrap{width:100%; max-width:400px;}
  .brand{
    display:block; text-align:center; color:var(--white);
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:1.4rem; margin-bottom:1.75rem; text-decoration:none;
  }
  .brand span{color:var(--blue);}

  .auth-card{
    background:var(--white);
    border-radius:20px;
    padding:2rem 1.75rem;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45);
  }

  .tabs{display:flex; background:var(--paper); border-radius:999px; padding:4px; margin-bottom:1.75rem;}
  .tab{
    flex:1; border:none; background:transparent; padding:0.65rem;
    border-radius:999px; font-family:'Inter',sans-serif; font-weight:600;
    font-size:0.9rem; color:var(--ink); opacity:0.55; cursor:pointer;
    transition:background 0.2s ease, opacity 0.2s ease, color 0.2s ease;
  }
  .tab.is-active{background:var(--black); color:var(--white); opacity:1;}

  .field{margin-bottom:1.1rem;}
  .field label{display:block; font-size:0.82rem; font-weight:600; margin-bottom:0.4rem;}
  .field input{
    width:100%; padding:0.75rem 0.9rem; border-radius:10px;
    border:1.5px solid rgba(16,24,43,0.12); font-family:'Inter',sans-serif;
    font-size:0.95rem; color:var(--ink); background:var(--paper);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .field input:focus{outline:none; border-color:var(--blue); background:var(--white);}

  .form-error{
    background:rgba(214,69,69,0.08); color:var(--red);
    border:1px solid rgba(214,69,69,0.25); border-radius:10px;
    padding:0.7rem 0.9rem; font-size:0.85rem; margin-bottom:1.1rem;
  }

  .g-recaptcha{margin-bottom:1.1rem;}

  .agree{
    display:flex; align-items:flex-start; gap:0.6rem; font-size:0.82rem;
    color:var(--ink); opacity:0.85; margin-bottom:1.4rem; cursor:pointer; line-height:1.45;
  }
  .agree input{margin-top:0.2rem; width:16px; height:16px; accent-color:var(--blue); flex-shrink:0;}
  .agree a{color:var(--black); font-weight:600; text-decoration:underline; text-underline-offset:2px;}

  .btn-submit{
    width:100%; padding:0.85rem; border-radius:999px; border:none;
    background:var(--blue); color:var(--black); font-family:'Inter',sans-serif;
    font-weight:700; font-size:0.95rem; cursor:pointer;
    transition:background 0.15s ease, opacity 0.15s ease;
  }
  .btn-submit:hover:not(:disabled){background:var(--blue-bright);}
  .btn-submit:disabled{opacity:0.4; cursor:not-allowed;}

  .switch-line{text-align:center; margin-top:1.4rem; font-size:0.85rem; opacity:0.7;}
  .switch-line button{
    background:none; border:none; color:var(--black); font-weight:700;
    cursor:pointer; text-decoration:underline; text-underline-offset:2px;
    padding:0; font-size:inherit; font-family:inherit;
  }

  .btn-google{
    width:100%; display:flex; align-items:center; justify-content:center; gap:0.6rem;
    padding:0.75rem; border-radius:999px; border:1.5px solid rgba(16,24,43,0.15);
    background:var(--white); color:var(--ink); font-family:'Inter',sans-serif;
    font-weight:600; font-size:0.9rem; cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    margin-bottom:1.25rem;
  }
  .btn-google:hover:not(:disabled){border-color:rgba(16,24,43,0.3); background:#FAFAFA;}
  .btn-google:disabled{opacity:0.45; cursor:not-allowed;}

  .divider{display:flex; align-items:center; gap:0.75rem; margin-bottom:1.25rem; font-size:0.78rem; color:var(--mist);}
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:rgba(16,24,43,0.1);}

  #verify-view{text-align:center;}
  .verify-icon{font-size:2.5rem; margin-bottom:0.75rem;}
  #verify-view h2{font-family:'Space Grotesk',sans-serif; font-size:1.3rem; margin-bottom:0.6rem;}
  #verify-view p{font-size:0.88rem; opacity:0.75; margin-bottom:1.5rem; line-height:1.5;}
  #verify-view .form-error{text-align:left;}
  .btn-ghost-full{
    width:100%; padding:0.75rem; border-radius:999px; border:1.5px solid rgba(16,24,43,0.15);
    background:transparent; color:var(--ink); font-weight:600; font-size:0.9rem; cursor:pointer;
    margin-top:0.75rem; transition:border-color 0.15s ease;
  }
  .btn-ghost-full:hover{border-color:var(--black);}

  :focus-visible{outline:2px solid var(--blue-bright); outline-offset:2px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="auth-wrap">
  <a href="index.html" class="brand">Swift<span>Janta</span></a>

  <div class="auth-card">

    <div id="auth-view">
      <button type="button" id="google-btn" class="btn-google" disabled>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
      <div class="divider"><span>or</span></div>

      <div class="tabs" role="tablist">
        <button class="tab is-active" id="tab-login" role="tab" aria-selected="true" type="button">Log in</button>
        <button class="tab" id="tab-signup" role="tab" aria-selected="false" type="button">Create account</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field" id="field-name" hidden>
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="current-password">
        </div>

        <div id="form-error" class="form-error" role="alert" hidden></div>

        <div class="g-recaptcha" data-sitekey="6LfzxoMtAAAAAFyGh_aObadvMnQ0iMs-VwTHFH1f" data-callback="onRecaptchaSuccess" data-expired-callback="onRecaptchaExpired"></div>

        <label class="agree">
          <input type="checkbox" id="agree">
          <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a></span>
        </label>

        <button type="submit" id="submit-btn" class="btn-submit" disabled>Log in</button>
      </form>

      <p class="switch-line" id="switch-line">Don't have an account? <button type="button" id="switch-btn">Create one</button></p>
    </div>

    <div id="verify-view" hidden>
      <div class="verify-icon">✉️</div>
      <h2>Verify your email</h2>
      <p>We sent a verification link to <strong id="verify-email"></strong>. Open it, then come back here.</p>
      <div id="verify-error" class="form-error" role="alert" hidden></div>
      <button type="button" id="check-verified-btn" class="btn-submit">I've verified — continue</button>
      <button type="button" id="resend-btn" class="btn-ghost-full">Resend email</button>
      <p class="switch-line"><button type="button" id="verify-back-btn">Use a different account</button></p>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile,
    sendEmailVerification, GoogleAuthProvider, signInWithPopup, signOut, getAdditionalUserInfo
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsc21SzOKkxIcGBfv0gAC5g4x-hZ7DQU0",
    authDomain: "swiftjanta-fcaf9.firebaseapp.com",
    projectId: "swiftjanta-fcaf9",
    storageBucket: "swiftjanta-fcaf9.firebasestorage.app",
    messagingSenderId: "515717504429",
    appId: "1:515717504429:web:89260041f7f353e4f3d524",
    measurementId: "G-SB86ZNN11Q"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  // Creates the matching Firestore profile the first time someone signs in —
  // Firebase Auth alone only creates the login credential, not this record.
  async function provisionUserDoc(user, nameOverride){
    await setDoc(doc(db, 'users', user.uid), {
      name: nameOverride || user.displayName || '',
      email: user.email || '',
      phone: '',
      momoNumber: '',
      role: 'customer',
      walletBalance: 0,
      createdAt: serverTimestamp()
    });
  }

  const tabLogin   = document.getElementById('tab-login');
  const tabSignup  = document.getElementById('tab-signup');
  const fieldName  = document.getElementById('field-name');
  const nameInput  = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const agreeBox   = document.getElementById('agree');
  const submitBtn  = document.getElementById('submit-btn');
  const googleBtn  = document.getElementById('google-btn');
  const formError  = document.getElementById('form-error');
  const switchLine = document.getElementById('switch-line');
  const form       = document.getElementById('auth-form');
  const authView   = document.getElementById('auth-view');
  const verifyView = document.getElementById('verify-view');
  const verifyEmailEl = document.getElementById('verify-email');
  const verifyError   = document.getElementById('verify-error');
  const checkVerifiedBtn = document.getElementById('check-verified-btn');
  const resendBtn        = document.getElementById('resend-btn');
  const verifyBackBtn    = document.getElementById('verify-back-btn');

  let mode = 'login';
  let recaptchaOk = false;

  window.onRecaptchaSuccess = function(){ recaptchaOk = true; updateSubmitState(); };
  window.onRecaptchaExpired = function(){ recaptchaOk = false; updateSubmitState(); };

  function updateSubmitState(){
    submitBtn.disabled = !(agreeBox.checked && recaptchaOk);
    googleBtn.disabled = !agreeBox.checked;
  }
  agreeBox.addEventListener('change', updateSubmitState);

  function setMode(next){
    mode = next;
    const isSignup = mode === 'signup';
    tabLogin.classList.toggle('is-active', !isSignup);
    tabSignup.classList.toggle('is-active', isSignup);
    tabLogin.setAttribute('aria-selected', String(!isSignup));
    tabSignup.setAttribute('aria-selected', String(isSignup));
    fieldName.hidden = !isSignup;
    passwordInput.autocomplete = isSignup ? 'new-password' : 'current-password';
    submitBtn.textContent = isSignup ? 'Create account' : 'Log in';
    switchLine.innerHTML = isSignup
      ? 'Already have an account? <button type="button" id="switch-btn">Log in</button>'
      : 'Don\'t have an account? <button type="button" id="switch-btn">Create one</button>';
    hideError();
  }

  // Event delegation — survives switch-line's innerHTML being replaced above
  switchLine.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'switch-btn') setMode(mode === 'signup' ? 'login' : 'signup');
  });
  tabLogin.addEventListener('click', () => setMode('login'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  function showError(msg){ formError.textContent = msg; formError.hidden = false; }
  function hideError(){ formError.hidden = true; }

  function friendlyError(code){
    const map = {
      'auth/invalid-email': "That email address doesn't look right.",
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password. Try again.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/email-already-in-use': 'An account already exists with that email.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/too-many-requests': 'Too many attempts. Wait a moment and try again.',
      'auth/network-request-failed': 'Network error — check your connection.',
      'auth/popup-closed-by-user': 'Google sign-in was closed before finishing.',
      'auth/popup-blocked': 'Your browser blocked the Google sign-in popup — allow popups and try again.',
      'auth/cancelled-popup-request': 'Google sign-in was cancelled.',
      'auth/account-exists-with-different-credential': 'An account already exists with this email using a different sign-in method.'
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  function showVerifyView(user){
    authView.hidden = true;
    verifyView.hidden = false;
    verifyEmailEl.textContent = user.email;
    verifyError.hidden = true;
  }
  function showAuthView(){
    verifyView.hidden = true;
    authView.hidden = false;
    hideError();
  }

  // Shared post-sign-in check: Google accounts arrive pre-verified by Google;
  // email/password accounts only pass once emailVerified is true.
  async function afterSignIn(user){
    await user.reload();
    if (user.emailVerified) {
      window.location.href = 'dashboard.html';
    } else {
      showVerifyView(user);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    if (!agreeBox.checked){ showError('Please agree to the Terms and Privacy Policy first.'); return; }
    if (!recaptchaOk){ showError('Please complete the reCAPTCHA.'); return; }

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const originalLabel = submitBtn.textContent;

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signup' ? 'Creating account…' : 'Logging in…';

    try {
      if (mode === 'signup') {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const trimmedName = nameInput.value.trim();
        if (trimmedName) {
          await updateProfile(cred.user, { displayName: trimmedName });
        }
        await provisionUserDoc(cred.user, trimmedName);
        await sendEmailVerification(cred.user);
        showVerifyView(cred.user);
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await afterSignIn(cred.user);
      }
    } catch (err) {
      showError(friendlyError(err.code));
      submitBtn.textContent = originalLabel;
      updateSubmitState();
    }
  });

  googleBtn.addEventListener('click', async () => {
    if (!agreeBox.checked){ showError('Please agree to the Terms and Privacy Policy first.'); return; }
    hideError();
    googleBtn.disabled = true;
    try {
      const result = await signInWithPopup(auth, googleProvider);
      const info = getAdditionalUserInfo(result);
      if (info && info.isNewUser) {
        await provisionUserDoc(result.user);
      }
      await afterSignIn(result.user);
    } catch (err) {
      showError(friendlyError(err.code));
    } finally {
      updateSubmitState();
    }
  });

  checkVerifiedBtn.addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) { showAuthView(); return; }
    checkVerifiedBtn.disabled = true;
    checkVerifiedBtn.textContent = 'Checking…';
    await user.reload();
    if (user.emailVerified) {
      window.location.href = 'dashboard.html';
    } else {
      verifyError.textContent = "Still not verified — check your inbox (and spam folder), then try again.";
      verifyError.hidden = false;
      checkVerifiedBtn.disabled = false;
      checkVerifiedBtn.textContent = "I've verified — continue";
    }
  });

  resendBtn.addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) { showAuthView(); return; }
    resendBtn.disabled = true;
    const originalLabel = resendBtn.textContent;
    resendBtn.textContent = 'Sending…';
    try {
      await sendEmailVerification(user);
      resendBtn.textContent = 'Sent!';
      setTimeout(() => { resendBtn.textContent = originalLabel; resendBtn.disabled = false; }, 3000);
    } catch (err) {
      verifyError.textContent = friendlyError(err.code);
      verifyError.hidden = false;
      resendBtn.textContent = originalLabel;
      resendBtn.disabled = false;
    }
  });

  verifyBackBtn.addEventListener('click', async () => {
    await signOut(auth);
    form.reset();
    showAuthView();
  });
</script>
</body>
  </html>
