<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Airtime — SwiftJanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="swiftjanta.css">
</head>
<body>

<div id="gate">Loading…</div>

<div id="app" hidden>
  <div class="topbar">
    <div class="topbar-inner">
      <a href="dashboard.html" class="back-link">← Dashboard</a>
      <span class="wordmark">Swift<span>Janta</span></span>
      <button class="logout-btn" id="logout-btn" type="button">Log out</button>
    </div>
  </div>

  <main>
    <div class="balance-strip">
      <span>Wallet balance</span>
      <span class="amount mono" id="balance-amount">GHS 0.00</span>
    </div>

    <h1 class="page-title">Buy Airtime</h1>
    <p class="page-sub">Top up any MTN, AirtelTigo, or Telecel number instantly.</p>

    <div class="card">
      <div id="form-error" class="form-error" role="alert" hidden></div>
      <div id="form-success" class="form-success" role="status" hidden></div>

      <form id="purchase-form" novalidate>
        <span class="group-label">Network</span>
        <div class="chip-group" id="network-chips" role="group" aria-label="Network">
          <button type="button" class="chip" data-network="mtn">MTN</button>
          <button type="button" class="chip" data-network="airteltigo">AirtelTigo</button>
          <button type="button" class="chip" data-network="telecel">Telecel</button>
        </div>

        <span class="group-label">Amount</span>
        <div class="chip-group" id="amount-chips" role="group" aria-label="Amount">
          <button type="button" class="chip" data-amount="5">GHS 5</button>
          <button type="button" class="chip" data-amount="10">GHS 10</button>
          <button type="button" class="chip" data-amount="20">GHS 20</button>
          <button type="button" class="chip" data-amount="50">GHS 50</button>
          <button type="button" class="chip" data-amount="100">GHS 100</button>
        </div>

        <div class="field">
          <label for="custom-amount">Or enter a custom amount (GHS)</label>
          <input type="number" id="custom-amount" min="1" step="0.5" placeholder="e.g. 15">
        </div>

        <div class="field">
          <label for="phone">Recipient phone number</label>
          <input type="tel" id="phone" required placeholder="024 123 4567" autocomplete="tel">
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span class="mono" id="summary-total">GHS 0.00</span>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary" disabled>Buy Airtime</button>
      </form>
    </div>
  </main>
</div>

<script type="module">
  import { requireAuth, watchBalance, wireLogout, createOrder } from './swiftjanta-app.js';

  let uid = null;
  let currentBalance = 0;
  let selectedNetwork = null;
  let selectedAmount = null;

  const networkChips  = document.querySelectorAll('#network-chips .chip');
  const amountChips   = document.querySelectorAll('#amount-chips .chip');
  const customAmount  = document.getElementById('custom-amount');
  const phoneInput    = document.getElementById('phone');
  const summaryTotal  = document.getElementById('summary-total');
  const submitBtn     = document.getElementById('submit-btn');
  const formError     = document.getElementById('form-error');
  const formSuccess   = document.getElementById('form-success');
  const form          = document.getElementById('purchase-form');
  const balanceEl     = document.getElementById('balance-amount');

  wireLogout('logout-btn');

  networkChips.forEach(chip => chip.addEventListener('click', () => {
    networkChips.forEach(c => c.classList.remove('is-active'));
    chip.classList.add('is-active');
    selectedNetwork = chip.dataset.network;
    updateState();
  }));

  amountChips.forEach(chip => chip.addEventListener('click', () => {
    amountChips.forEach(c => c.classList.remove('is-active'));
    chip.classList.add('is-active');
    selectedAmount = parseFloat(chip.dataset.amount);
    customAmount.value = '';
    updateState();
  }));

  customAmount.addEventListener('input', () => {
    amountChips.forEach(c => c.classList.remove('is-active'));
    selectedAmount = parseFloat(customAmount.value) || null;
    updateState();
  });
  phoneInput.addEventListener('input', updateState);

  function updateState(){
    summaryTotal.textContent = 'GHS ' + (selectedAmount || 0).toFixed(2);
    submitBtn.disabled = !(selectedNetwork && selectedAmount > 0 && phoneInput.value.trim().length >= 9);
  }

  requireAuth((user) => {
    document.getElementById('app').hidden = false;
    uid = user.uid;
    watchBalance(uid, (balance) => {
      currentBalance = balance;
      balanceEl.textContent = 'GHS ' + balance.toFixed(2);
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.hidden = true;
    formSuccess.hidden = true;

    if (selectedAmount > currentBalance) {
      formError.textContent = 'Your wallet balance is lower than this amount — top up first.';
      formError.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Placing order…';
    try {
      await createOrder({
        uid, productType: 'airtime', network: selectedNetwork,
        recipientPhone: phoneInput.value.trim(), amountGHS: selectedAmount
      });
      formSuccess.textContent = "Order placed — it'll be processed and delivered shortly.";
      formSuccess.hidden = false;
      form.reset();
      networkChips.forEach(c => c.classList.remove('is-active'));
      amountChips.forEach(c => c.classList.remove('is-active'));
      selectedNetwork = null;
      selectedAmount = null;
    } catch (err) {
      formError.textContent = 'Something went wrong placing that order. Try again.';
      formError.hidden = false;
      console.error(err);
    } finally {
      submitBtn.textContent = 'Buy Airtime';
      updateState();
    }
  });
</script>
</body>
        </html>
